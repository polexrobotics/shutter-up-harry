# Pulls new Instagram posts and commits them. Run by hand only (Actions tab →
# "Instagram sync" → "Run workflow"); posts are currently imported from Harry's
# Instagram data export with `npm run import`, so there is no daily schedule.
# Needs the IG_ACCESS_TOKEN secret to be set before it can succeed.
name: Instagram sync

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch posts
        run: npm run sync
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "instagram-sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/data public/media sync-report.md
          git diff --cached --quiet || git commit -m "Sync Instagram posts"
          git push

