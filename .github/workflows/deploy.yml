# Builds the site and publishes it to GitHub Pages at https://shutterupharry.com.au
# Runs on every push to main, after the Instagram sync or Add photos, or by hand (Actions tab →
# "Deploy site" → "Run workflow").
# One-off setup in the repo: Settings → Pages → Source: "GitHub Actions",
# Custom domain: shutterupharry.com.au, then tick "Enforce HTTPS".
name: Deploy site

on:
  push:
    branches: [main]
    # New uploads are published by the "Add photos" run that processes them.
    paths-ignore: ['inbox/**']
  workflow_run:
    workflows: [Instagram sync, Add photos]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://shutterupharry.com.au
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
